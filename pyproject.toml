[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hive-autogen-actor"
version = "0.1.0"
description = "AutoGen ConversableAgent subclass with Hive payment hooks (marketplace, checkout, receipts, ads)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Steve Rotzin", email = "steve@thehiveryiq.com" },
]
keywords = ["autogen", "hive", "x402", "agent-commerce", "payments", "web3", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pyautogen>=0.4.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/srotzin/hive-autogen-actor"
Repository = "https://github.com/srotzin/hive-autogen-actor"
Issues = "https://github.com/srotzin/hive-autogen-actor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_autogen_actor"]
